spring:
  application:
    name: transaction-api

  datasource:
    url: jdbc:h2:mem:authdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true

server:
  port: 8081

transaction:
  service:
    url: http://localhost:8082

encryption:
  key: ${ENCRYPTION_KEY}

security:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}

  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600000


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html